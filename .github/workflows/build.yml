# SPDX-License-Identifier: GPL-3.0-only
# Build LUXR (JieLi toolchain + AC79 SDK): build/luxr.fwsc as the artifact luxr-fwsc; from main also GitHub Pages:
# the update page (web/make_luxr_admin.py) with luxr.fwsc next to it, loaded at once: https://<user>.github.io/LUXR/
# (the sample layer is the Sonic Potions LXR's transient samples, whose licence is not the GPL: README.md).
name: build
on:
  push: { branches: [main, "feature/**"] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: "build-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python and font tools
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y libraqm0 libfribidi0 >/dev/null
          pip install -q pillow
      - name: Cache toolchain and SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1-1
      - name: JieLi toolchain
        run: test -e ~/.jieli/toolchain || sh tools/get_toolchain.sh
      - name: AC79 SDK
        run: |
          test -d ~/fw-AC79_AIoT_SDK/.git || for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK; sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK/.git
      - name: Tests (host)
        run: sudo apt-get -qq install -y clang >/dev/null && sh tests/run.sh || echo "::warning::host tests failed"
        continue-on-error: true
      - name: Firmware
        env: { JIELI_DOCKER: "0" }
        shell: bash
        run: |
          set -o pipefail
          export JIELI_TOOLCHAIN=$HOME/.jieli/toolchain AC79_SDK=$HOME/fw-AC79_AIoT_SDK
          python3 tools/build.py --app lxr 2>&1 | tee build.log && exit 0
          # the log on the branch ci-log (readable without the web UI)
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q --orphan ci-log && git rm -rqf --cached . && git add -f build.log && git commit -qm "build log $GITHUB_SHA" && git push -qf origin ci-log
          exit 1
      - uses: actions/upload-artifact@v4
        with: { name: luxr-fwsc, path: build/luxr.fwsc }
      - name: Update page with the firmware of this build
        if: github.ref == 'refs/heads/main'
        run: |
          python3 web/make_luxr_admin.py
          mkdir -p site && cp build/web/luxr-update.html site/index.html && cp build/luxr.fwsc site/
          printf '{"date":"%s","commit":"%s","sha256":"%s"}\n' "$(date -u +%F\ %H:%M)" "$GITHUB_SHA" "$(sha256sum build/luxr.fwsc | cut -d' ' -f1)" > site/build.json
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: site }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
